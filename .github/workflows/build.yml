name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jadecompanion-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Verify release contains only the DEB
        run: |
          echo "Package output:"
          find packages -maxdepth 1 -type f -print
          test "$(find packages -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" = "1"
          test "$(find packages -maxdepth 1 -type f ! -name '*.deb' | wc -l | tr -d ' ')" = "0"



      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.6.1
          name: JadeCompanion v0.6.1
          prerelease: false
          draft: false
          body: |
            JadeCompanion fixes Jade 1.0.5's broken iOS 16 connectivity long-press behaviour.

            Jade already detects a hold on its connectivity row, but its original expansion path can leave Jade in a blurred "expanded" state without actually showing the Connectivity interface.

            JadeCompanion intercepts that broken connectivity hold before Jade enters the bad state and opens Apple's real Control Center connectivity controllers instead.

            Hold behaviour:
            1. Wi-Fi: Apple's Wi-Fi detail menu.
            2. Bluetooth: Apple's Bluetooth device menu.
            3. AirDrop: Apple's AirDrop menu.
            4. Airplane Mode: Apple's expanded connectivity panel.
            5. Cellular Data: Apple's expanded connectivity panel.
            6. Normal taps remain handled by Jade exactly as before.

            The attached release contains only the rootless DEB. Full details are in the repository README.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
