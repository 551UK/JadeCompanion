name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jadecompanion-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JadeCompanion-rootless-v0.5.0
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.5.0
          name: JadeCompanion v0.5.0
          prerelease: true
          body: |
            Fifth test build for Jade 1.0.5.

            Major change:
            - Stops adding a separate long-press recognizer.
            - Hooks Jade's own built-in JadeFullWidthModule handleLongPress: method directly.
            - Jade already installs this recognizer itself and uses AudioServices haptic feedback on hold.
            - For JadeConnectivityModule only, JadeCompanion replaces that handler instead of calling Jade's original one.
            - This also targets Jade's existing "hold a connectivity button, then the next Jade swipe only blurs" bug by preventing Jade's broken connectivity long-press path from running.
            - Wi-Fi, Bluetooth and AirDrop attempt to open the real stock Control Center connectivity detail.
            - Airplane Mode and Cellular open the real expanded stock Connectivity module.
            - A temporary on-screen diagnostic message appears only if JadeCompanion detects the hold but Apple's stock view does not open. This removes any ambiguity from Jade's own haptic feedback.

            Primary target: Jade 1.0.5 on iOS 16 + Dopamine rootless.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
