name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jadecompanion-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JadeCompanion-rootless-v0.3.0
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.3.0
          name: JadeCompanion v0.3.0
          prerelease: true
          body: |
            Third test build focused on making the long press attach reliably to Jade 1.0.5.

Changes:
- Hooks JadeCardViewController and JadeConnectivityModule directly.
- Adds one long-press recognizer to the whole Jade connectivity module, so it no longer depends on JadeConnectivityButton being re-created after SpringBoard starts.
- Determines Wi-Fi, Bluetooth, Airplane Mode, Cellular and AirDrop by the real Jade button ivars and touch location.
- Resets Jade's conflicting pan/hold recognizers only after a real long press begins, targeting Jade's pre-existing "hold, then next swipe only blurs" bug.
- Uses Jade's own expandModuleWithIdentifier: method to open Apple's real Connectivity module.
- Wi-Fi, Bluetooth and AirDrop then attempt the stock second-level detail interaction.
- Normal Jade taps remain unchanged.

Primary target: Jade 1.0.5 on iOS 16 + Dopamine rootless.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
