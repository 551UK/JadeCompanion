name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jadecompanion-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Prepare release asset
        run: |
          test "$(find packages -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" = "1"
          mkdir -p release
          cp "$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)" release/JadeCompanion.deb
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: release
          name: JadeCompanion
          prerelease: false
          draft: false
          body: JadeCompanion fixes Jade's connectivity hold menus on iOS 16.
          artifacts: release/JadeCompanion.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

      - name: Remove old releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ "$tag" != "release" ]; then
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done

          gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags" --paginate --jq '.[].ref' | while read -r ref; do
            tag="${ref#refs/tags/}"
            if [ "$tag" != "release" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" || true
            fi
          done
