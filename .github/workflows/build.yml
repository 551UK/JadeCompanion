name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jadecompanion-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JadeCompanion-rootless-v0.2.0
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.2.0
          name: JadeCompanion v0.2.0
          prerelease: true
          body: |
            Reworked test build for Jade 1.0.5 after the original v0.1.0 long-press path failed.

            Changes:
            - Hooks JadeConnectivityButton directly instead of relying on the module lifecycle.
            - Gives the companion long-press priority over Jade's ancestor pan recognizers to avoid Jade's pre-existing "hold, then next swipe only blurs" state.
            - Uses Jade's own expandModuleWithIdentifier: path to open Apple's real Connectivity module.
            - Wi-Fi, Bluetooth and AirDrop then trigger the stock Control Center detail interaction.
            - Airplane Mode and Cellular Data open the real expanded Connectivity module.
            - Normal Jade taps remain unchanged.

            Primary target: Jade 1.0.5 on iOS 16 + Dopamine rootless.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
