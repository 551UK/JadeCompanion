name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jadecompanion-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JadeCompanion-rootless-v0.4.0
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.4.0
          name: JadeCompanion v0.4.0
          prerelease: true
          body: |
            Fourth test build for Jade 1.0.5.

            Important fix:
            - v0.3 looked up Jade's connectivity controls as non-underscored ivars only.
            - Jade exposes names such as wifiButton through accessors while the backing ivars are normally _wifiButton-style names.
            - That meant a hold could reach the recognizer but fail button identification before the haptic or action fired.
            - v0.4 now checks the property accessor, exact ivar name and underscored backing ivar.
            - Jade's own pan and long-press recognizers are also made to wait for JadeCompanion's recognizer only when the touch is actually over a connectivity button.
            - Normal taps remain unchanged.

            Primary target: Jade 1.0.5 on iOS 16 + Dopamine rootless.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
