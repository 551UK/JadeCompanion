name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jadecompanion-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JadeCompanion-rootless-v0.6.1
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.6.1
          name: JadeCompanion v0.6.1
          prerelease: true
          body: |
            Polished test build after v0.6 successfully opened Apple's Wi-Fi and Bluetooth detail views.

            Changes:
            - Keeps the working v0.6 architecture that bypasses Jade's broken Connectivity expansion path.
            - Explicitly forwards appearance transitions when swapping Apple's stock detail controllers into the companion host.
            - This is especially important for Bluetooth, whose stock menu refreshes its device list from viewWillAppear:.
            - Wi-Fi, Bluetooth and AirDrop continue to use Apple's real stock detail controllers.
            - Airplane Mode and Cellular Data continue to show the real expanded stock Connectivity controller.
            - Jade's original connectivity long-press path remains suppressed, avoiding the blur-only stuck state.
            - Normal Jade taps remain unchanged.

            Primary target: Jade 1.0.5 on iOS 16 + Dopamine rootless.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
