name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jadecompanion-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Verify release contains only the DEB
        run: |
          echo "Package output:"
          find packages -maxdepth 1 -type f -print
          test "$(find packages -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" = "1"
          test "$(find packages -maxdepth 1 -type f ! -name '*.deb' | wc -l | tr -d ' ')" = "0"

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.6.2
          name: JadeCompanion v0.6.2
          prerelease: false
          draft: false
          body: |
            Fixes Jade's broken connectivity hold menus on iOS 16.

            Hold Wi-Fi, Bluetooth, AirDrop, Airplane Mode or Cellular Data to open the proper Control Center connectivity views.

            Normal taps still toggle through Jade. Holding a button opens its menu without toggling it, and the old blur-only bug remains fixed.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

      - name: Remove superseded v0.6.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only remove the previous release after v0.6.2 has been published.
          gh release view v0.6.2
          if gh release view v0.6.1 >/dev/null 2>&1; then
            gh release delete v0.6.1 --cleanup-tag --yes
          fi
