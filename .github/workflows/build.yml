name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jadecompanion-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Verify release contains only the DEB
        run: |
          echo "Package output:"
          find packages -maxdepth 1 -type f -print
          test "$(find packages -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" = "1"
          test "$(find packages -maxdepth 1 -type f ! -name '*.deb' | wc -l | tr -d ' ')" = "0"

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.6.8
          name: JadeCompanion v0.6.8
          prerelease: false
          draft: false
          body: |
            Fixes Jade's broken connectivity hold menus on iOS 16.

            Hold Wi-Fi, Bluetooth, Cellular Data or Airplane Mode to open Apple's native expanded Connectivity platter. v0.6.8 is a stability reset based on the last known-loading v0.6.5 code: the v0.6.6 global Airplane hook and custom root-window backdrop are removed. AirDrop keeps its existing dedicated menu path.

            Normal taps still toggle through Jade. Outside taps now close the expanded stock Connectivity module through dismissExpandedModuleAnimated: instead of the unsafe presentation-dismiss path. Airplane behaviour is unchanged from v0.6.7.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

      - name: Remove superseded releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only remove older releases after v0.6.8 has been published.
          gh release view v0.6.8
          for tag in v0.6.2 v0.6.3 v0.6.4 v0.6.5 v0.6.6 v0.6.7; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done
