name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jadecompanion-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JadeCompanion-rootless-v0.6.0
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.6.0
          name: JadeCompanion v0.6.0
          prerelease: true
          body: |
            Sixth test build for Jade 1.0.5.

            Root cause found in Jade itself:
            - JadeConnectivityModule already inherits JadeFullWidthModule's built-in long-press recognizer.
            - JadeConnectivityModule sets its internal module identifier to com.apple.control-center.ConnectivityModule.
            - Jade's long-press path sets its own moduleExpanded/blur state, then calls moduleViewForIdentifier: and expandModuleWithIdentifier: on Apple's stock Control Center collection.
            - That path fails for the replaced Connectivity module, leaving Jade blurred with no expanded UI.
            - This explains why Focus, Screen Recording and other original modules expand correctly while Jade's custom connectivity row does not.

            v0.6 changes the architecture:
            - Does not call JadeCardViewController expandModuleWithIdentifier: for connectivity at all.
            - Reuses Jade's existing long-press recognizer only for touch detection.
            - Creates Apple's real CCUIContentModuleContext and CCUIConnectivityModule / CCUIConnectivityModuleViewController.
            - Presents that stock controller in its own overlay so Jade's moduleExpanded/blur state is never wedged.
            - Wi-Fi, Bluetooth and AirDrop then attempt their real stock second-level detail controllers.
            - Airplane Mode and Cellular Data show the real expanded stock Connectivity controller.
            - Normal Jade taps are unchanged.

            Primary target: Jade 1.0.5 on iOS 16 + Dopamine rootless.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
