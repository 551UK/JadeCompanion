name: Build rootless deb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: jadecompanion-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: JadeCompanion-rootless-v0.1.0
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.1.0
          name: JadeCompanion v0.1.0
          body: |
            Initial rootless test release for Jade 1.0.5.

            Adds Haptic Touch / long-press actions to Jade's connectivity buttons while preserving Jade's normal tap behavior.

            - Wi-Fi: opens Apple's Wi-Fi detail menu
            - Bluetooth: opens Apple's Bluetooth device menu
            - AirDrop: opens Apple's AirDrop menu
            - Airplane Mode: opens the expanded connectivity panel
            - Cellular Data: opens the expanded connectivity panel

            Primary target: iOS 16 + Dopamine rootless.
          artifacts: packages/*.deb
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
